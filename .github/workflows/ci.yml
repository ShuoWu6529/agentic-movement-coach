name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Cache pose models
        uses: actions/cache@v4
        with:
          path: public/models
          key: pose-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run build
      # Playwright (M1): fake-camera smoke, camera permission denied, log download. pytest joins in M6.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
