name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Cache pose models
        uses: actions/cache@v4
        with:
          path: public/models
          key: pose-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run build
      # Deferred (SPEC 8.1): Playwright smoke test from M1, pytest from M6.
